<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 BMS Lab</title>
<meta name="description" content="Build an ESP32 battery management system on a breadboard, step by step in 3D, then experiment with it in the built-in simulator. Korean, English, Japanese, Chinese.">
<meta name="theme-color" content="#f6f3e8">
<meta property="og:type" content="website">
<meta property="og:url" content="https://esp32-bms-lab3d.vercel.app/">
<meta property="og:title" content="ESP32 BMS Lab">
<meta property="og:image" content="https://esp32-bms-lab3d.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://esp32-bms-lab3d.vercel.app/og.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:description" content="ESP32 BMS를 3D로 단계별 조립하고, 내장 시뮬레이터로 실험해 보세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 크림색 작업장. 왼쪽 큰 카드 = 3D 작업대 + 아래 단계 띠, 오른쪽 카드 = 지금 단계의 설명·조작. 노랑 = 진행, 남색 = 조작, 초록 = 정상 */
:root {
  --bg: #f6f3e8; --card: #faf7ee; --card-border: #e7e2d4; --tile: #fffdf6; --tile-border: #e9e4d8; --line: #ebe6da; --warm-line: #d9d2bf;
  --ink: #0e1932; --ink-soft: #2b3346; --muted: #5d6272; --faint: #8a8d96; --track: #e1dfd8; --terminal: #13203a;
  --yellow-hi: #ffdd84; --yellow: #fdd062; --yellow-lo: #f6c047; --yellow-ink: #2b2611;
  --navy-hi: #284a70; --navy: #1e3a5c; --navy-deep: #13203a; --green: #1f9a78; --green-hi: #2fb38f;
  --lv0: #1e9e55; --lv1: #e6b800; --lv2: #f07f12; --lv3: #d62f2f; --trip: #2563c9;
  --f-display: "Oswald", "Noto Sans KR", "Noto Sans JP", "Noto Sans SC", "Arial Narrow", sans-serif;
  --f-ui: "Roboto Condensed", "Noto Sans KR", "Noto Sans JP", "Noto Sans SC", "Arial Narrow", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r-card: 18px; --r-tile: 12px;
  color-scheme: light;
}
:lang(ja) { --f-ui: "Roboto Condensed", "Noto Sans JP", sans-serif; --f-display: "Oswald", "Noto Sans JP", sans-serif; }
:lang(zh) { --f-ui: "Roboto Condensed", "Noto Sans SC", sans-serif; --f-display: "Oswald", "Noto Sans SC", sans-serif; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14.5px; line-height: 1.55; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--navy-hi); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

.app { height: 100%; display: grid; grid-template-rows: 68px 1fr; }
/* 머리 */
.top { display: flex; align-items: center; gap: 14px; padding: 0 18px; min-width: 0; }
.logo { width: 40px; height: 40px; border-radius: 11px; background: var(--g, linear-gradient(180deg, var(--navy-hi), var(--navy))); display: grid; place-items: center; flex: none; box-shadow: 0 2px 0 var(--navy-deep); }
.word { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 25px; letter-spacing: 1.5px; line-height: 1; white-space: nowrap; }
.word em { font-style: normal; color: var(--green); }
.sep { width: 1px; height: 30px; background: var(--warm-line); }
.credit { display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; line-height: 1.15; }
.credit .gh { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); display: grid; place-items: center; }
.credit small { display: block; color: var(--faint); font-size: 11px; }
.credit b { font-size: 13px; font-weight: 600; }
.spacer { flex: 1; }
.tlabel { color: var(--muted); font-size: 13px; }
.segtop { display: flex; background: var(--tile); border: 1px solid var(--card-border); border-radius: 12px; padding: 3px; gap: 2px; }
.segtop button { border: 0; background: none; padding: 6px 14px; border-radius: 9px; font-weight: 700; font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.segtop a.segsens { padding: 6px 14px; border-radius: 9px; font-weight: 700; font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap; }
.segtop a.segsens:hover { color: var(--ink); background: #fff8e2; }
.segtop button[aria-pressed="true"] { background: linear-gradient(180deg, var(--navy-hi), var(--navy)); color: #fff; box-shadow: 0 2px 0 var(--navy-deep); }
.pill { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border: 1px solid var(--card-border); background: var(--tile); border-radius: 12px; position: relative; font-weight: 700; }
.pill select { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.iconbtn { width: 38px; height: 38px; border: 1px solid var(--card-border); background: var(--tile); border-radius: 12px; display: grid; place-items: center; }

/* 본문 */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 16px; padding: 0 18px 18px; min-height: 0; }
.leftcol { display: grid; grid-template-rows: minmax(0, 1fr) 96px; gap: 12px; min-height: 0; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--r-card); box-shadow: 0 1px 0 rgba(14,25,50,.04), 0 10px 30px -18px rgba(14,25,50,.25); }
.stage { position: relative; overflow: hidden; min-height: 0; }
#view { position: absolute; inset: 0; }
#view canvas { display: block; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.tag { font-family: var(--f-mono); font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: rgba(255,253,246,.96); color: var(--ink); border: 1px solid var(--warm-line); white-space: nowrap; transform: translateY(-12px); }
.tag.moved::after { content: ''; position: absolute; left: 50%; top: 100%; width: 1.5px; height: var(--lead, 0px); background: rgba(14,25,50,.55); transform: translateX(-50%); }
.tag.pin { background: var(--navy); color: #fff; border-color: var(--navy-deep); }
.tag.probe { background: var(--yellow); color: var(--yellow-ink); border-color: var(--yellow-lo); font-family: var(--f-ui); font-size: 12px; }
/* 작업대 위 겹친 요소 */
.chip { position: absolute; top: 14px; left: 14px; display: flex; align-items: center; gap: 10px; z-index: 3; pointer-events: none; }
.chip .ic { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 40% 30%, var(--yellow-hi), var(--yellow) 55%, var(--yellow-lo)); display: grid; place-items: center; box-shadow: 0 2px 0 #d9a92f; }
.chip h2 { margin: 0; font-family: var(--f-display); font-size: 22px; font-weight: 600; line-height: 1.1; }
.chip p { margin: 0; color: var(--muted); font-size: 11.5px; letter-spacing: .2px; }
.status { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; padding: 3px 10px; border-radius: 99px; background: var(--tile); border: 1px solid var(--card-border); font-size: 12.5px; font-weight: 700; color: var(--ink); vertical-align: 3px; }
.status i { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--lv0)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, var(--lv0)) 25%, transparent); }
.tele { position: absolute; top: 64px; left: 14px; display: flex; gap: 8px; z-index: 3; }
.tile { background: var(--tile); border: 1px solid var(--tile-border); border-radius: var(--r-tile); padding: 6px 12px 7px; min-width: 76px; box-shadow: 0 1px 0 rgba(14,25,50,.05); }
.tile small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; }
.tile b { font-family: var(--f-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile span { font-size: 11px; color: var(--muted); margin-left: 2px; }
.tools { position: absolute; top: 14px; right: 14px; display: grid; gap: 8px; z-index: 3; }
.tools button { width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--card-border); background: var(--tile); display: grid; place-items: center; box-shadow: 0 1px 0 rgba(14,25,50,.06); }
.tools button[aria-pressed="true"] { background: radial-gradient(circle at 40% 30%, var(--yellow-hi), var(--yellow) 55%, var(--yellow-lo)); border-color: var(--yellow-lo); }
.tools .gap { height: 6px; }
.float { position: absolute; z-index: 3; background: var(--tile); border: 1px solid var(--tile-border); border-radius: 14px; padding: 10px 12px; box-shadow: 0 8px 24px -14px rgba(14,25,50,.35); }
.trendc { left: 14px; bottom: 14px; width: 240px; }
.trendc canvas { display: block; width: 100%; height: 110px; }
.flab { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.flab i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
.flowc { right: 14px; bottom: 14px; width: 300px; }
#flowsvg { display: block; width: 100%; height: auto; }
#flowsvg [data-node] rect { fill: var(--tile); stroke: var(--warm-line); }
#flowsvg [data-node].on rect { fill: var(--yellow); stroke: var(--yellow-lo); }
#flowsvg text { font: 600 10.5px var(--f-ui); fill: var(--ink); }
.fcs b { display: block; font-size: 13.5px; margin-top: 6px; }
.fcs span { display: block; font-size: 11.5px; color: var(--muted); }
.fcrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.navbtn { border: 0; border-radius: 9px; background: linear-gradient(180deg, var(--navy-hi), var(--navy)); color: #fff; font-weight: 700; font-size: 12.5px; padding: 6px 12px; white-space: nowrap; box-shadow: 0 2px 0 var(--navy-deep); }
.navbtn.warnbtn { background: linear-gradient(180deg, #3d73d6, var(--trip)); }
.tip { position: absolute; display: none; pointer-events: none; z-index: 6; max-width: 320px; background: var(--terminal); color: #eef3f3; border-radius: 10px; padding: 9px 12px; font-size: 13px; line-height: 1.45; box-shadow: 0 10px 24px rgba(14,25,50,.3); }
.tip b { display: block; font-size: 13.5px; margin-bottom: 2px; }
.tip .sub { color: #9fb1c6; font-size: 12px; margin-top: 3px; }
.tip .act { margin-top: 6px; color: var(--yellow); font-weight: 700; font-size: 12.5px; }
.tip .mono { color: var(--yellow); }
.toast { position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); background: var(--terminal); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; z-index: 7; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.stage.nocards .float { display: none !important; }
.status.live i { --c: var(--green); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--green) 10%, transparent); } }
.err { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 30px; color: var(--muted); z-index: 2; }
body:not([data-kind="run"]) .runonly { display: none !important; }
body[data-kind="run"] .buildonly { display: none !important; }

/* 단계 띠 */
.stripwrap { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; gap: 6px; padding: 0 8px; }
.round { width: 34px; height: 34px; border-radius: 50%; border: 0; background: linear-gradient(180deg, var(--navy-hi), var(--navy)); color: #fff; display: grid; place-items: center; box-shadow: 0 2px 0 var(--navy-deep); }
.strip { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 8px 2px; scroll-snap-type: x proximity; }
.strip::-webkit-scrollbar { display: none; }
.scard { flex: none; width: 158px; height: 70px; display: grid; grid-template-columns: 64px 1fr; grid-template-rows: auto 1fr; align-items: center; column-gap: 8px; padding: 4px 10px 4px 4px; border: 1.5px solid var(--card-border); border-radius: 14px; background: var(--tile); text-align: left; scroll-snap-align: center; }
.scard .thumb { grid-row: 1 / span 2; width: 64px; height: 60px; border-radius: 10px; overflow: hidden; background: #ede7d6; }
.scard .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sbadge { justify-self: start; align-self: end; font-family: var(--f-mono); font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--navy); color: #fff; }
.sname { align-self: start; font-family: var(--f-display); font-weight: 600; font-size: 14px; line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.scard.done .sbadge { background: var(--green); }
.scard.on { border-color: var(--yellow-lo); background: #fff8e2; box-shadow: 0 0 0 3px color-mix(in srgb, var(--yellow) 45%, transparent); }
.scard.on .sbadge { background: var(--yellow); color: var(--yellow-ink); }

/* 오른쪽 패널 */
.panel { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; overflow: hidden; }
.phead { display: flex; gap: 12px; align-items: center; padding: 18px 18px 12px; }
.num { width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 18px; color: var(--yellow-ink); background: radial-gradient(circle at 40% 30%, var(--yellow-hi), var(--yellow) 55%, var(--yellow-lo)); box-shadow: 0 2px 0 #d9a92f; }
.kick { font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .3px; }
.phead h1 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 27px; line-height: 1.15; text-wrap: balance; }
.pbody { overflow-y: auto; padding: 2px 18px 18px; scrollbar-width: thin; scrollbar-color: var(--warm-line) transparent; }
.pbody h3 { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .6px; color: var(--muted); margin: 18px 0 8px; text-transform: uppercase; }
.pbody h3 small { font-family: var(--f-ui); text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); margin-left: 6px; }
.desc, .lead { margin: 0 0 6px; color: var(--ink-soft); }
.lead { font-weight: 600; color: var(--ink); }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rows li { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: var(--tile); border: 1px solid var(--tile-border); border-radius: var(--r-tile); padding: 8px 10px; }
.rows li.ghost { opacity: .6; border-style: dashed; }
.rl { min-width: 0; }
.rl b { display: flex; align-items: center; gap: 6px; font-size: 13.5px; }
.rl span { display: block; color: var(--muted); font-size: 12px; }
.rl .tagx { display: inline-block; margin-top: 2px; font-size: 11px; font-weight: 700; color: var(--yellow-ink); background: var(--yellow); padding: 0 6px; border-radius: 5px; }
.rc { display: flex; align-items: center; gap: 4px; flex: none; flex-wrap: wrap; justify-content: flex-end; max-width: 55%; }
.hole { font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 7px; background: var(--navy); color: #fff; white-space: nowrap; }
.arrow { color: var(--faint); font-size: 12px; }
.val { font-size: 12.5px; font-weight: 700; background: color-mix(in srgb, var(--green) 14%, var(--tile)); color: #116650; padding: 2px 8px; border-radius: 7px; }
.pnum { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 6px; background: var(--yellow); color: var(--yellow-ink); font-size: 11px; }
.sw { display: inline-block; width: 16px; height: 6px; border-radius: 3px; border: 1px solid rgba(0,0,0,.18); flex: none; }
.tips { margin: 6px 0 0; padding-left: 18px; color: var(--ink-soft); }
.tips li { margin: 5px 0; }
.tips li.warn { color: var(--lv3); font-weight: 600; }
.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.checks label { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 9px; cursor: pointer; }
.checks label:hover { background: var(--tile); }
.checks input { accent-color: var(--green); width: 16px; height: 16px; margin-top: 3px; flex: none; }
.checks input:checked + span { color: var(--faint); text-decoration: line-through; }
.note { margin-top: 10px; background: var(--tile); border: 1px solid var(--tile-border); border-radius: var(--r-tile); padding: 9px 11px; font-size: 13px; color: var(--ink-soft); }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 12px; color: var(--muted); }
.legend > span { display: flex; align-items: center; gap: 6px; }
.plist { display: grid; gap: 6px; }
.pcard { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; text-align: left; border: 1px solid var(--tile-border); background: var(--tile); border-radius: var(--r-tile); padding: 8px 11px; }
.pcard:hover, .pcard.on { border-color: var(--yellow-lo); }
.pcard.on { background: #fff8e2; }
.pn { font-weight: 700; }
.pq { color: var(--muted); font-size: 12px; }
.pd { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.bands { grid-column: 1 / -1; display: flex; align-items: center; height: 12px; margin: 3px 0; }
.bands::before, .bands::after { content: ""; width: 10px; height: 2px; background: #9aa0a3; }
.rb { display: flex; gap: 4px; background: #e2cf9f; border-radius: 6px; padding: 0 7px; height: 12px; }
.rb i { width: 4px; height: 12px; display: block; }
.nums { margin: 8px 0 12px; padding-left: 20px; color: var(--ink-soft); }
.nums li { margin: 4px 0; }
details.more { margin-top: 14px; border: 1px solid var(--tile-border); border-radius: var(--r-tile); background: var(--tile); }
details.more summary { cursor: pointer; padding: 9px 12px; font-weight: 700; font-family: var(--f-display); letter-spacing: .3px; }
details.more > :not(summary) { margin: 0 12px 12px; }
table { width: calc(100% - 24px); border-collapse: collapse; font-size: 12.5px; }
th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; color: var(--muted); }
table.num td + td, table.num th + th { text-align: right; font-family: var(--f-mono); }
.kind { color: var(--faint); font-size: 11px; }
.lv { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 5px; color: #fff; font-family: var(--f-ui); }
.lv1 { background: var(--lv1); color: #1d2428; } .lv2 { background: var(--lv2); } .lv3 { background: var(--lv3); }
/* 실험 조작 */
.loadbox { display: flex; align-items: center; gap: 12px; background: var(--tile); border: 1px solid var(--tile-border); border-radius: var(--r-tile); padding: 10px 12px; }
.power { width: 54px; height: 54px; border-radius: 50%; border: 0; flex: none; display: grid; place-items: center; background: linear-gradient(180deg, var(--navy-hi), var(--navy)); box-shadow: 0 3px 0 var(--navy-deep); }
.power svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; }
.power[aria-pressed="true"] { background: linear-gradient(180deg, var(--green-hi), var(--green)); box-shadow: 0 3px 0 #11624c, 0 0 0 5px color-mix(in srgb, var(--green) 22%, transparent); }
.power:disabled { opacity: .5; cursor: default; }
.loadtxt { flex: 1; min-width: 0; }
.loadtxt b { display: block; font-family: var(--f-display); font-size: 19px; letter-spacing: .5px; }
.loadtxt span { display: block; font-size: 12px; color: var(--muted); }
.ybtn { border: 0; border-radius: 11px; padding: 10px 16px; font-weight: 700; color: var(--yellow-ink); background: linear-gradient(180deg, #ffd977, var(--yellow-lo)); box-shadow: 0 2px 0 #d9a92f; white-space: nowrap; }
.ybtn.sm { padding: 7px 11px; font-size: 13px; }
.ybtn:disabled { opacity: .45; cursor: default; }
.swrow { display: flex; justify-content: space-between; align-items: center; padding: 9px 2px; border-bottom: 1px solid var(--line); }
.swrow span { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.ldot { width: 8px; height: 8px; border-radius: 50%; }
.switch { width: 44px; height: 24px; border-radius: 99px; border: 0; background: var(--track); position: relative; padding: 0; flex: none; }
.switch i { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--navy); }
.switch[aria-checked="true"] i { left: 23px; }
@media (prefers-reduced-motion: reduce) { .switch i, .toast { transition: none; } }
.seg { display: flex; background: var(--track); border-radius: 11px; padding: 3px; gap: 2px; margin-bottom: 6px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 8px; padding: 7px 4px; font-weight: 700; font-size: 13px; color: var(--ink-soft); }
.seg button[aria-checked="true"] { background: linear-gradient(180deg, var(--navy-hi), var(--navy)); color: #fff; box-shadow: 0 2px 0 var(--navy-deep); }
.slrow { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; font-weight: 600; }
input[type=range] { width: 100%; accent-color: var(--navy); }
.keys { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 10px 0 2px; font-size: 12px; color: var(--muted); }
kbd { font-family: var(--f-mono); font-size: 11px; background: var(--tile); border: 1px solid var(--warm-line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; margin-right: 2px; color: var(--ink); }
.term { margin-top: 12px; background: var(--terminal); border-radius: var(--r-tile); overflow: hidden; color: #cfe0f5; }
.thead { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; font-size: 12px; color: #9fb1c6; border-bottom: 1px solid #22314f; }
.term pre { margin: 0; height: 190px; overflow: auto; padding: 8px 10px; font: 11.3px/1.55 var(--f-mono); color: #6ee7b7; }
.mini { border: 1px solid #34466a; background: #1b2b4a; color: #dbe6f5; border-radius: 7px; padding: 2px 9px; font-size: 11.5px; }
.term.code pre { height: auto; max-height: calc(100vh - 470px); min-height: 220px; color: #dfe6ee; }
.code .c { color: #7e93b3; } .code .k { color: #7cc7ff; } .code .n { color: var(--yellow); }
.ttabs { display: flex; gap: 2px; padding: 4px 6px 0; border-bottom: 1px solid #22314f; overflow-x: auto; }
.ttabs button { border: 0; background: none; color: #8ea3c2; padding: 7px 10px; font-weight: 700; font-size: 12.5px; border-bottom: 2px solid transparent; white-space: nowrap; }
.ttabs button[aria-selected="true"] { color: #fff; border-bottom-color: var(--yellow); }
.tfoot { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-top: 1px solid #22314f; font-size: 11.5px; color: #8ea3c2; }
.pfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.ghostbtn { border: 1px solid var(--card-border); background: var(--tile); border-radius: 11px; padding: 9px 14px; font-weight: 700; }
.ghostbtn:disabled { opacity: .45; cursor: default; }
.hintk { font-size: 12px; color: var(--muted); }
.srcbox { display: flex; align-items: center; gap: 10px; background: var(--tile); border: 1.5px dashed var(--warm-line); border-radius: var(--r-tile); padding: 10px 12px; margin-bottom: 12px; }
.srcbox.on { border-style: solid; border-color: var(--green); background: color-mix(in srgb, var(--green) 8%, var(--tile)); }
.srcdot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); flex: none; }
.srcbox.on .srcdot { background: var(--green); box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 22%, transparent); }
.srct { flex: 1; min-width: 0; }
.srct b { display: block; font-size: 14px; }
.srct span { display: block; font-size: 12px; color: var(--muted); }
.ghostbtn.sm { padding: 7px 11px; font-size: 13px; }
.simonly.off .swrow, .simonly.off .seg, .simonly.off .slrow, .simonly.off input[type=range], .simonly.off .hint, .simonly.off h3 { opacity: .45; }
.switch:disabled, .seg button:disabled { cursor: not-allowed; }
.hint { margin: 6px 0 2px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.dlcard { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); background: #fff8e2; border: 1.5px solid var(--yellow-lo); border-radius: var(--r-tile); padding: 10px 12px; margin: 10px 0 4px; }
.dlcard:hover { background: #fff2cc; }
.dlic { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--yellow-ink); background: radial-gradient(circle at 40% 30%, var(--yellow-hi), var(--yellow) 55%, var(--yellow-lo)); box-shadow: 0 2px 0 #d9a92f; }
.dlcard b { display: block; font-size: 14.5px; }
.dlcard small { display: block; font-size: 11px; color: var(--muted); }
.linkbtn { border: 0; background: none; color: var(--muted); font-size: 12px; text-decoration: underline; padding: 4px 8px; margin-top: 2px; }
/* 설정 */
.modal { position: fixed; inset: 0; background: rgba(14,25,50,.35); display: grid; place-items: center; z-index: 20; padding: 16px; }
.mbox { width: min(420px, 100%); background: var(--card); border: 1px solid var(--card-border); border-radius: var(--r-card); padding: 20px; box-shadow: 0 20px 60px -20px rgba(14,25,50,.5); }
.mbox h2 { margin: 0 0 6px; font-family: var(--f-display); font-weight: 700; letter-spacing: 1px; font-size: 20px; }
.mbtns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

@media (max-width: 1100px) { .main { grid-template-columns: minmax(0, 1fr) 360px; } .tele .tile { min-width: 64px; padding: 5px 9px; } .tile b { font-size: 19px; } .flowc { width: 250px; } .credit, .sep { display: none; } }
/* 수정됨: 키가 낮은 화면(노트북 1280×720 등)에서는 겹친 카드를 작게 */
@media (max-height: 820px) and (min-width: 821px) {
  .tele { top: 58px; gap: 6px; } .tile { padding: 4px 9px 5px; min-width: 62px; } .tile b { font-size: 18px; } .tile small { font-size: 10.5px; }
  .chip h2 { font-size: 19px; } .chip .ic { width: 30px; height: 30px; }
  .trendc { width: 200px; padding: 8px 10px; } .trendc canvas { height: 72px; }
  .flowc { width: 250px; padding: 8px 10px; } #flowsvg { display: none; } .fcs b { margin-top: 0; }
  .leftcol { grid-template-rows: minmax(0, 1fr) 88px; } .scard { height: 64px; } .scard .thumb { height: 54px; }
}
@media (max-width: 820px) {
  body { overflow: auto; }
  .app { height: auto; grid-template-rows: auto auto; }
  .top { flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
  .tlabel { display: none; }
  .main { grid-template-columns: 1fr; padding: 0 10px 14px; }
  .leftcol { grid-template-rows: 62vh 96px; }
  .flowc, .trendc { display: none !important; }
  #vCards { display: none !important; }
  .tele { top: auto; bottom: 12px; left: 12px; right: 12px; gap: 6px; }
  .tele .tile { flex: 1; min-width: 0; }
  .panel { max-height: none; }
  .pbody { overflow: visible; }
  .word { font-size: 21px; }
  .tele .tile:last-child, .chip p { display: none; }
  .tele .tile { padding: 5px 8px; }
  .tile b { font-size: 18px; }
}
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>

<body data-kind="run">
<div class="app">
  <header class="top">

      <button type="button" data-jump="run" aria-pressed="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span data-t="실험"></span></button>

  <div class="main">

        <div class="chip">

          <div><h2><span id="chipTitle"></span><span class="status runonly"><i></i><span id="srcBadge">시뮬레이터</span></span></h2><p id="chipSub"></p></div>
        </div>
        <div class="tele runonly" aria-live="off">
          <div class="tile"><small>VBUS</small><b id="tV">4.62</b><span>V</span></div>
          <div class="tile"><small data-t="전류"></small><b id="tI">0.0</b><span>mA</span></div>
          <div class="tile"><small data-t="온도"></small><b id="tT">24.8</b><span>°C</span></div>
          <div class="tile"><small data-t="위험도"></small><b id="tR">0</b><span>/100</span></div>
          <div class="tile"><small data-t="상태"></small><b class="lvb"><span class="status" style="margin:0;padding:1px 8px"><i></i><span id="stLv" style="color:var(--ink);font-size:14px;margin:0"></span></span></b></div>

          <button type="button" id="zOut" data-ta="축소"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <span class="gap"></span>
          <button type="button" id="vHome" data-ta="처음 시점"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M3 8V4h4M21 8V4h-4M3 16v4h4M21 16v4h-4"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button type="button" id="vTop" aria-pressed="false" data-ta="위에서 보기"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
          <button type="button" id="vCards" class="runonly" aria-pressed="false" data-ta="그래프·흐름도 카드 숨기기"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="13" width="8" height="7" rx="2"/><rect x="13" y="13" width="8" height="7" rx="2"/><path d="M3 4h18M3 8h12"/></svg></button>
